name: Cross-platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.97.0"
  WINDOWS_TARGET: x86_64-pc-windows-msvc

jobs:
  build-android:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test Android release
        working-directory: android
        run: |
          chmod +x gradlew
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Clipmo CI" -noprompt
          ./gradlew test assembleRelease --no-daemon

      - name: Upload Android release APK
        uses: actions/upload-artifact@v7
        with:
          name: clipmo-android-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  validate-and-bundle:
    name: Validate and bundle Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ env.WINDOWS_TARGET }}
          cache-targets: true
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci --no-audit

      - name: Validate Windows packaging contract
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) { throw "$($script.Name): $($errors -join '; ')" }
          }
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $quick = $tauri.app.windows | Where-Object { $_.label -eq 'quick' }
          if (-not $quick) { throw 'Missing quick window configuration.' }
          if ($tauri.productName -ne 'Clipmo') { throw "Expected productName Clipmo; got $($tauri.productName)" }
          if ($tauri.identifier -ne 'app.clipdeck.desktop') { throw 'The legacy application identifier changed unexpectedly.' }
          if ($tauri.bundle.publisher -ne 'Jackson Kasi') { throw "Expected publisher Jackson Kasi; got $($tauri.bundle.publisher)" }
          if ($tauri.bundle.copyright -notmatch 'Jackson Kasi') { throw 'Copyright owner must be Jackson Kasi.' }
          if ($quick.decorations -ne $false -or $quick.shadow -ne $false -or $quick.resizable -ne $false -or $quick.alwaysOnTop -ne $true -or $quick.skipTaskbar -ne $true) {
            throw 'Quick window configuration does not preserve the frameless, shadowless flyout contract.'
          }

      - name: Test frontend
        run: npm test

      - name: Build and type-check frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: >-
          cargo clippy
          --manifest-path src-tauri/Cargo.toml
          --target ${{ env.WINDOWS_TARGET }}
          --locked
          --all-targets
          --
          -D warnings

      - name: Run Rust tests on Windows MSVC
        run: >-
          cargo test
          --manifest-path src-tauri/Cargo.toml
          --target ${{ env.WINDOWS_TARGET }}
          --locked
          --all-targets
          --
          --test-threads=1

      - name: Prepare Windows code signing
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: ./scripts/prepare-windows-signing.ps1

      - name: Build NSIS installer
        shell: pwsh
        env:
          SIGNING_CONFIG: ${{ steps.signing.outputs.config }}
        run: |
          $arguments = @(
            'tauri', 'build',
            '--ci',
            '--target', '${{ env.WINDOWS_TARGET }}',
            '--bundles', 'nsis'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CONFIG)) {
            $arguments += @('--config', $env:SIGNING_CONFIG)
          }
          & npx @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Authenticode signatures
        shell: pwsh
        run: >-
          ./scripts/verify-windows-signing.ps1
          -TargetTriple "${{ env.WINDOWS_TARGET }}"
          -ExpectedSigned "${{ steps.signing.outputs.enabled }}"

      - name: Build, extract, and smoke-test exact release assets
        id: collect
        shell: pwsh
        run: >-
          ./scripts/collect-windows-artifacts.ps1
          -TargetTriple "${{ env.WINDOWS_TARGET }}"
          -OutputDirectory "artifacts/windows-x64"

      - name: Reject the quick-window white frame
        shell: pwsh
        run: >-
          ./scripts/assert-quick-window-frame.ps1
          -Screenshot "artifacts/windows-x64/${{ steps.collect.outputs.quick_screenshot }}"

      - name: Upload the tested installer and startup screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clipmo-windows-x64-${{ github.sha }}
          path: |
            artifacts/windows-x64/Clipmo_*_x64-setup.exe
            artifacts/windows-x64/Clipmo_*_main-startup.png
            artifacts/windows-x64/Clipmo_*_quick-startup.png
          if-no-files-found: warn
          retention-days: 14
