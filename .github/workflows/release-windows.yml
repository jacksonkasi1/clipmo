name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.97.0"
  WINDOWS_TARGET: x86_64-pc-windows-msvc

jobs:
  build-android:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Android release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          test -n "$version"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            expected_version="${{ github.ref_name }}"
            expected_version="${expected_version#v}"
            test "$version" = "$expected_version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test Android release
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ github.ref_type }}" = "tag" ]; then
            test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
            export ANDROID_KEYSTORE_PATH=release.keystore
          else
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Clipmo CI" -noprompt
          fi
          ./gradlew test assembleRelease --no-daemon

      - name: Upload Android release APK
        uses: actions/upload-artifact@v7
        with:
          name: clipmo-android-apk-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build and verify Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.collect.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ env.WINDOWS_TARGET }}
          cache-targets: true
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci --no-audit

      - name: Validate release scripts and version files
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) { throw "$($script.Name): $($errors -join '; ')" }
          }
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauriVersion = $tauri.version
          if ($tauri.productName -ne 'Clipmo') { throw "Expected Tauri productName Clipmo; got $($tauri.productName)" }
          if ($tauri.identifier -ne 'app.clipdeck.desktop') { throw 'The legacy application identifier changed unexpectedly.' }
          if ($tauri.bundle.publisher -ne 'Jackson Kasi') { throw "Expected Tauri publisher Jackson Kasi; got $($tauri.bundle.publisher)" }
          if ($tauri.bundle.copyright -notmatch 'Jackson Kasi') { throw 'Copyright owner must be Jackson Kasi.' }
          $quick = $tauri.app.windows | Where-Object { $_.label -eq 'quick' }
          if (-not $quick) { throw 'Missing quick window configuration.' }
          if ($quick.decorations -ne $false -or $quick.shadow -ne $false -or $quick.resizable -ne $false -or $quick.alwaysOnTop -ne $true -or $quick.skipTaskbar -ne $true) {
            throw 'Quick window configuration does not preserve the frameless, shadowless flyout contract.'
          }
          $cargoVersion = (cargo metadata --format-version 1 --no-deps --locked --manifest-path src-tauri/Cargo.toml | ConvertFrom-Json).packages.Where({$_.name -eq 'clipdeck'}).version
          if (($packageVersion, $tauriVersion, $cargoVersion | Select-Object -Unique).Count -ne 1) {
            throw "Version mismatch: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }

      - name: Test frontend
        run: npm test

      - name: Build and type-check frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: >-
          cargo clippy
          --manifest-path src-tauri/Cargo.toml
          --target ${{ env.WINDOWS_TARGET }}
          --locked
          --all-targets
          --
          -D warnings

      - name: Run Rust tests on Windows MSVC
        run: >-
          cargo test
          --manifest-path src-tauri/Cargo.toml
          --target ${{ env.WINDOWS_TARGET }}
          --locked
          --all-targets
          --
          --test-threads=1

      - name: Prepare Windows code signing
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: ./scripts/prepare-windows-signing.ps1

      - name: Require trusted signing for tagged releases
        if: github.ref_type == 'tag' && steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: throw 'Tagged Clipmo releases require WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD; refusing to publish an unsigned installer.'

      - name: Build NSIS installer
        shell: pwsh
        env:
          SIGNING_CONFIG: ${{ steps.signing.outputs.config }}
        run: |
          $arguments = @(
            'tauri', 'build',
            '--ci',
            '--target', '${{ env.WINDOWS_TARGET }}',
            '--bundles', 'nsis'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CONFIG)) {
            $arguments += @('--config', $env:SIGNING_CONFIG)
          }
          & npx @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Authenticode signatures
        shell: pwsh
        run: >-
          ./scripts/verify-windows-signing.ps1
          -TargetTriple "${{ env.WINDOWS_TARGET }}"
          -ExpectedSigned "${{ steps.signing.outputs.enabled }}"

      - name: Build, extract, and smoke-test exact release assets
        id: collect
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $expectedVersion = if ($env:RELEASE_REF_TYPE -eq "tag") {
            $env:RELEASE_REF_NAME -replace '^v', ''
          } else {
            ""
          }

          ./scripts/collect-windows-artifacts.ps1 `
            -TargetTriple "${{ env.WINDOWS_TARGET }}" `
            -OutputDirectory "artifacts/windows-x64" `
            -ExpectedVersion $expectedVersion

      - name: Reject the quick-window white frame
        shell: pwsh
        run: >-
          ./scripts/assert-quick-window-frame.ps1
          -Screenshot "artifacts/windows-x64/${{ steps.collect.outputs.quick_screenshot }}"

      - name: Upload the verified installer and main/quick screenshots
        uses: actions/upload-artifact@v7
        with:
          name: clipmo-windows-x64-${{ steps.collect.outputs.version }}
          path: |
            artifacts/windows-x64/${{ steps.collect.outputs.installer }}
            artifacts/windows-x64/${{ steps.collect.outputs.main_screenshot }}
            artifacts/windows-x64/${{ steps.collect.outputs.quick_screenshot }}
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v8
        with:
          name: clipmo-windows-x64-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Download Android release APK
        uses: actions/download-artifact@v8
        with:
          name: clipmo-android-apk-${{ needs.build-android.outputs.version }}
          path: release-assets

      - name: Create or update GitHub release with verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          installer="release-assets/Clipmo_${RELEASE_VERSION}_x64-setup.exe"
          android_apk="release-assets/app-release.apk"
          main_screenshot="release-assets/Clipmo_${RELEASE_VERSION}_main-startup.png"
          quick_screenshot="release-assets/Clipmo_${RELEASE_VERSION}_quick-startup.png"
          test -s "$installer" && test -s "$android_apk" && test -s "$main_screenshot" && test -s "$quick_screenshot"
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 4
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              case "$asset" in
                "$(basename "$installer")"|"$(basename "$android_apk")") ;;
                *) gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY" ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY")
            gh release upload "$RELEASE_TAG" "$installer" "$android_apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$installer" "$android_apk" \
              --verify-tag \
              --generate-notes \
              --title "Clipmo $RELEASE_VERSION" \
              --repo "$GITHUB_REPOSITORY"
          fi
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length' --repo "$GITHUB_REPOSITORY")" -eq 2
