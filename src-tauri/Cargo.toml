[package]
name = "clipdeck"
version = "0.2.5"
description = "Clipmo clipboard history for Windows"
authors = ["Jackson Kasi"]
edition = "2021"
rust-version = "1.85"
default-run = "clipdeck"

[lib]
name = "clipdeck_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.40", features = ["bundled", "functions"] }
parking_lot = "0.12"
thiserror = "2"
log = "0.4"
sha2 = "0.10"
url = "2"
sysinfo = "0.33"

image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "webp"] }
window-vibrancy = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
incremental = true
